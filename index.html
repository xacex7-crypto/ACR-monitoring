<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>로봇 에러 모니터링</title>
    <style>
        body {
            background-color: #0f172a;
            color: #f8fafc;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 15px;
        }
        .header {
            margin-bottom: 15px;
            border-bottom: 1px solid #334155;
            padding-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .header h2 {
            margin: 0;
            color: #f1f5f9;
            font-size: 1.4em;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            background-color: #1e293b;
            border-radius: 6px;
            overflow: hidden;
            font-size: 0.95em;
        }
        th, td {
            padding: 12px 15px;
            text-align: left;
            border-bottom: 1px solid #334155;
        }
        th {
            background-color: #334155;
            color: #cbd5e1;
            font-weight: 600;
        }
        tr:hover {
            background-color: #263548;
        }
        .badge-danger {
            background-color: #ef4444;
            color: white;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 0.8em;
            font-weight: bold;
        }
        /* 팝업 알람창 디자인 */
        #popup-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.7);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 9999;
        }
        .popup-box {
            background-color: #1e293b;
            border: 3px solid #ef4444;
            padding: 30px;
            border-radius: 12px;
            text-align: center;
            max-width: 400px;
            width: 90%;
            box-shadow: 0 10px 25px rgba(239, 68, 68, 0.4);
        }
        .popup-box h3 {
            color: #ef4444;
            margin-top: 0;
            font-size: 1.5em;
        }
        .popup-box p {
            color: #cbd5e1;
            font-size: 1.1em;
        }
        .popup-btn {
            background-color: #ef4444;
            color: white;
            border: none;
            padding: 10px 20px;
            font-size: 1em;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            margin-top: 15px;
        }
        .popup-btn:hover {
            background-color: #dc2626;
        }
    </style>
</head>
<body>

    <div class="header">
        <h2>📊 실시간 로봇 에러 모니터링 리스트</h2>
        <span id="status-text" style="color: #38bdf8; font-size: 0.9em;">● 감시 중 (3초 간격)</span>
    </div>

    <table>
        <thead>
            <tr>
                <th style="width: 15%;">상태</th>
                <th style="width: 20%;">로봇 ID</th>
                <th style="width: 65%;">에러 내용</th>
            </tr>
        </thead>
        <tbody id="error-table-body">
            <!-- 에러 목록이 여기에 동적으로 표시됩니다 -->
            <tr>
                <td><span class="badge-danger">긴급</span></td>
                <td><strong>40251865</strong></td>
                <td>Many error robots in the fire emergency area (화재 비상 구역 진입)</td>
            </tr>
        </tbody>
    </table>

    <!-- 에러 발생 시 뜨는 팝업 알람창 -->
    <div id="popup-overlay">
        <div class="popup-box">
            <h3>🚨 긴급 로봇 에러 발생!</h3>
            <p id="popup-message">새로운 에러가 접수되었습니다. 확인해주세요.</p>
            <button class="popup-btn" onclick="closePopup()">확인 (닫기)</button>
        </div>
    </div>

    <script>
        // 알람창을 닫는 함수
        function closePopup() {
            document.getElementById('popup-overlay').style.display = 'none';
        }

        // 임시 테스트용: 페이지를 열고 3초 뒤에 팝업 알람이 번쩍 뜨도록 설정해 둔 예시입니다.
        setTimeout(() => {
            document.getElementById('popup-message').innerText = '[로봇 ID: 40251865] 화재 비상 구역 진입 에러 발생!';
            document.getElementById('popup-overlay').style.display = 'flex';
        }, 3000);
    </script>

</body>
</html>
