<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>로봇 에러 모니터링</title>
    <style>
        body {
            background-color: #0f172a;
            color: #f8fafc;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 20px;
        }
        .header {
            margin-bottom: 20px;
            border-bottom: 1px solid #334155;
            padding-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .header h2 {
            margin: 0;
            color: #f1f5f9;
            font-size: 1.4em;
        }
        .btn-permission {
            background-color: #3b82f6;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
        }
        .btn-permission:hover {
            background-color: #2563eb;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            background-color: #1e293b;
            border-radius: 6px;
            overflow: hidden;
        }
        th, td {
            padding: 12px 15px;
            text-align: left;
            border-bottom: 1px solid #334155;
        }
        th {
            background-color: #334155;
            color: #cbd5e1;
        }
        .badge-danger {
            background-color: #ef4444;
            color: white;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 0.8em;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="header">
        <h2>📊 실시간 로봇 에러 모니터링</h2>
        <!-- 브라우저 알림 권한 허용 버튼 -->
        <button class="btn-permission" onclick="requestNotificationPermission()">🔔 바탕화면 알림 켜기</button>
    </div>

    <table>
        <thead>
            <tr>
                <th style="width: 15%;">상태</th>
                <th style="width: 20%;">로봇 ID</th>
                <th style="width: 65%;">에러 내용</th>
            </tr>
        </thead>
        <tbody id="error-table-body">
            <tr>
                <td><span class="badge-danger">긴급</span></td>
                <td><strong>40251865</strong></td>
                <td>Many error robots in the fire emergency area (화재 비상 구역 진입)</td>
            </tr>
        </tbody>
    </table>

    <script>
        // 페이지가 열릴 때 알림 권한 요청 허용 묻기
        function requestNotificationPermission() {
            if (!("Notification" in window)) {
                alert("이 브라우저는 알림을 지원하지 않습니다.");
            } else {
                Notification.requestPermission().then((permission) => {
                    if (permission === "granted") {
                        alert("알림이 허용되었습니다! 이제 창을 내려놔도 알림이 뜹니다.");
                    } else {
                        alert("알림 권한이 거부되었습니다. 브라우저 설정에서 허용해주세요.");
                    }
                });
            }
        }

        // 윈도우 시스템 알림을 띄우는 함수 (모니터링 화면을 내려놔도 우측 하단에 뜸)
        function showDesktopNotification(title, message) {
            if (Notification.permission === "granted") {
                new Notification(title, {
                    body: message,
                    icon: "https://cdn-icons-png.flaticon.com/512/564/564619.png"
                });
            }
        }

        // 임시 테스트용: 페이지 접속 후 3초 뒤에 다른 창을 보고 있더라도 우측 하단에 알림이 뜸
        setTimeout(() => {
            showDesktopNotification("🚨 긴급 로봇 에러 발생!", "[로봇 ID: 40251865] 화재 비상 구역 진입 에러 발생!");
        }, 3000);
    </script>

</body>
</html>
